<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'" />
  <title>LSPD MDT Pomocník</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/600.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/montserrat/800.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/500.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/600.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>

  <header class="titlebar">
    <div class="tb-brand">
      <img class="app-logo" src="../assets/icon.png" alt="" />
      <div class="tb-name">
        <span class="tb-dept">Los Santos Police Department</span>
        <span class="tb-app">MDT Pomocník</span>
      </div>
    </div>
    <div class="tb-center">
      <button class="tb-me" id="tbMe" title="Kdo jsem – změnit v Nastavení"></button>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="tbCalc" title="Kalkulačka trestu (Ctrl + Shift + M)" data-icon="calc"></button>
      <button class="tb-btn" id="tbPin" title="Vždy navrchu" data-icon="pin"></button>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="tbMin" title="Minimalizovat" data-icon="minus"></button>
      <button class="tb-btn" id="tbMax" title="Maximalizovat" data-icon="square"></button>
      <button class="tb-btn tb-close" id="tbClose" title="Zavřít" data-icon="x"></button>
    </div>
  </header>

  <div class="upd-bar" id="updBar"></div>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="view" id="view"></main>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="data/offenses.js"></script>
  <script src="data/codes.js"></script>
  <script src="data/officers.js"></script>
  <script src="data/guides.js"></script>
  <script src="js/web-shim.js"></script>
  <script src="js/core.js"></script>
  <script src="js/report.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
